[package]
name = "terminal-switcher"
version = "0.1.0"
edition = "2021"

[dependencies]
iced = { version = "0.14", features = ["tokio"] }
nucleo-matcher = "0.3"
global-hotkey = "0.6"
serde = { version = "1", features = ["derive"] }
toml = "0.8"
dirs = "6"
shellexpand = "3"
tokio = { version = "1", features = ["time"] }
tray-icon = "0.19"

[target.'cfg(windows)'.dependencies]
windows = { version = "0.58", features = ["Win32_UI_WindowsAndMessaging", "Win32_Foundation"] }

[dev-dependencies]
tempfile = "3"

[profile.release]
strip = true
lto = true
codegen-units = 1
